name: smart_insole
description: Smart Insole Runner App — BLE pressure heatmap & GPS tracking.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # BLE
  flutter_blue_plus: ^1.31.0

  # State management
  provider: ^6.1.2

  # Maps (GPS tracking)
  google_maps_flutter: ^2.6.1

  # Permissions
  permission_handler: ^11.3.1

  # UI helpers
  cupertino_icons: ^1.0.6
  fl_chart: ^0.68.0          # for pressure history charts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/foot_outline.png
